[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t3-mprf-runtime"
version = "0.1.0"
description = "Isolated online MPRF loop-candidate service for Task 3"
requires-python = ">=3.10,<3.11"

[project.scripts]
t3-mprf-service = "mprf_runtime.service:main"

[tool.setuptools.packages.find]
include = ["mprf_runtime*"]

