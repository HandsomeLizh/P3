# Live quarter-resolution derivative of calibration_spreadsheets_parallel_24p9.yaml.
# The sensor adapter downsamples 2448x2048 to 612x512 with cv::resize. Intrinsic
# pixel coordinates are therefore scaled uniformly by 0.25. Metric extrinsics,
# baseline, field of view, and the confirmed 24.9 degree mounting angle are unchanged.

calibration_metadata:
  source_intrinsics: vehicle_frd_calibration_20260817.xlsx
  source_hardware: multimodal_sensor_architecture_v7.xlsx
  parent_profile: simulation_parallel_24p9
  profile: simulation_parallel_24p9_live_quarter
  image_scale: 0.25
  measured_vehicle_axes: x_forward_y_right_z_down
  ros_body_axes: x_forward_y_left_z_up
  geometry_assumptions:
    - identical left/right mounting rotation
    - exactly parallel optical axes
    - measured stereo baseline retained
    - simulator uses an ideal zero-distortion pinhole model
    - intrinsics are uniformly scaled from the 2448x2048 calibration

